<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vitals — Health Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/health-192.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="vitals">
  <header>
    <div class="site-brand">
      <svg class="site-logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#fff" opacity="0.12"/><path d="M7 12c1.5-2 4-3 5-3s3.5 1 5 3" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <h1>Vitals</h1>
    </div>
    <div class="header-actions"><a href="dashboard.html">←</a></div>
  </header>

  <main>
    <section id="vitals-section" class="tab">
      <h2>Record Vitals</h2>
      <form id="vitals-form">
        <label class="label">Type</label>
        <select id="vital-type">
          <option value="temperature">Temperature (°C/°F)</option>
          <option value="bp">Blood Pressure (mmHg)</option>
          <option value="pulse">Pulse Rate (bpm)</option>
        </select>

        <div id="vital-fields">
          <!-- Temperature fields (shown by default) -->
          <div class="vital-group" data-type="temperature">
            <label class="label">Temperature</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="number" step="0.1" id="vital-temp" placeholder="e.g. 37.5" />
              <select id="vital-unit"><option value="C">°C</option><option value="F">°F</option></select>
            </div>
          </div>

          <!-- Blood pressure -->
          <div class="vital-group" data-type="bp" style="display:none">
            <label class="label">Blood pressure</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="number" id="vital-sys" placeholder="Systolic" />
              <input type="number" id="vital-dia" placeholder="Diastolic" />
            </div>
          </div>

          <!-- Pulse -->
          <div class="vital-group" data-type="pulse" style="display:none">
            <label class="label">Pulse rate</label>
            <input type="number" id="vital-pulse" placeholder="bpm" />
          </div>

          <label class="label">Time</label>
          <input type="datetime-local" id="vital-time" />

          <label class="label">Notes</label>
          <textarea id="vital-notes" placeholder="Notes or symptoms"></textarea>

          <div id="vitals-meds" class="small muted"></div>

          <div class="save-bar in-card">
            <div class="controls">
              <button type="submit" class="btn btn-primary btn-lg">Save Vitals</button>
            </div>
          </div>
        </div>
      </form>

      <h3>Vitals history</h3>
      <ul id="vitals-list"></ul>
    </section>
  </main>

  <nav class="bottom-nav" role="navigation" aria-label="Main">
    <a href="dashboard.html" id="nav-dashboard" class="nav-item" aria-label="Dashboard">
      <div class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
      <span>Dashboard</span>
    </a>
    <a href="medicines.html" id="nav-meds" class="nav-item" aria-label="Medicines">
      <div class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.59 13.41l-8.6 8.6c-1.56 1.56-4.09 1.56-5.66 0s-1.56-4.1 0-5.66l8.6-8.6 5.66 5.66zM7.1 6.9L6 8l2.12 2.12 1.1-1.1L7.1 6.9z"/></svg></div>
      <span>Medicines</span>
    </a>
    <a href="vitals.html" id="nav-fever" class="nav-item active" aria-label="Vitals">
      <div class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 14.5V7a3 3 0 0 0-6 0v7.5A4 4 0 1 0 15 14.5z"/></svg></div>
      <span>Vitals</span>
    </a>
    <a href="history.html" id="nav-history" class="nav-item" aria-label="History">
      <div class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17h3V7H3v10zm5 0h3V3H8v14zm5 0h3V11h-3v6zm5 0h3v-4h-3v4z"/></svg></div>
      <span>History</span>
    </a>
    <a href="settings.html" id="nav-settings" class="nav-item" aria-label="Settings">
      <div class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96c-.5-.4-1.05-.71-1.62-.94L14.5 2.5a.5.5 0 0 0-.5-.5h-3.99a.5.5 0 0 0-.5.5l-.38 2.1c-.57.23-1.1.54-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.9a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.6a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.4.32.62.22l2.39-.96c.5.4 1.05.71 1.62.94l.38 2.1c.05.27.28.48.55.48h3.99c.27 0 .5-.21.55-.48l.38-2.1c.57-.23 1.1-.54 1.62-.94l2.39.96c.22.09.49 0 .62-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58z"/></svg></div>
      <span>Settings</span>
    </a>
  </nav> 

  <script src="app.js"></script>
  <script>
  // small client-side bits for Vitals page
  (function(){
    const typeSel = document.getElementById('vital-type');
    const groups = document.querySelectorAll('.vital-group');
    typeSel.addEventListener('change', ()=>{
      groups.forEach(g=>g.style.display = g.dataset.type === typeSel.value ? 'block' : 'none');
    });
    // render medicines checkboxes
    const ms = document.getElementById('vitals-meds'); if(ms){ const meds = JSON.parse(localStorage.getItem('ht_meds')||'[]'); ms.innerHTML = meds.map(m=>`<label><input type="checkbox" data-id="${m.id}" /> ${m.name}</label>`).join(''); }
  })();
  </script>
</body>
</html>

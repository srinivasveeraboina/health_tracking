<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — Health Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/health-192.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="dashboard">
  <header>
    <div class="site-brand">
      <svg class="site-logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#fff" opacity="0.12"/><path d="M7 12c1.5-2 4-3 5-3s3.5 1 5 3" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <h1>Health Tracker</h1>
    </div>
    <div class="header-actions"><a href="medicines.html" id="quick-add-medicine">+ Med</a> <a href="vitals.html" id="quick-log-fever">+ Vitals</a></div>
  </header>

  <main>
    <section id="dashboard-section" class="tab">
      <h2>Dashboard</h2>
      <div class="dashboard-cards">
        <div class="card">
        <div class="card-header">
          <div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 10h10M7 6h10M5 20h14a2 2 0 0 0 2-2V8H3v10a2 2 0 0 0 2 2z" stroke="#0B76EF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><h3>Upcoming medicines</h3></div>
          <div class="card-action"><a href="medicines.html" class="muted">See all ▸</a></div>
        </div>
        <div id="upcoming-body" class="card-body">
          <div class="card-empty">
            <div class="empty-ico"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="#E6F0FF" stroke-width="1.5" fill="#F6FBFF"/><path d="M9.5 12.5l1.8 1.8L15 11.6" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="muted">No medicines scheduled for now.</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>Today</h3></div>
        <div class="stat-grid">
          <div class="stat stat-intake">
            <div class="value" id="dashboard-intakes">0</div>
            <div class="label">Intakes</div>
          </div>
          <div class="stat stat-fever">
            <div class="value" id="dashboard-vitals">0</div>
            <div class="label">Vitals</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>Quick actions</h3></div>
        <div class="controls">
          <button class="btn btn-primary btn-lg" id="dash-add-med"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Add medicine</button>
          <button class="btn btn-outline btn-lg" id="dash-log-fever"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2v7" stroke="#EF4444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 9a5 5 0 0 0 10 0V6a5 5 0 0 0-10 0v3z" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Log Vitals</button>
        </div>
      </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" role="navigation" aria-label="Main">
    <a href="dashboard.html" id="nav-dashboard" class="nav-item" aria-label="Dashboard">
      <div class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
      <span>Dashboard</span>
    </a>
    <a href="medicines.html" id="nav-meds" class="nav-item" aria-label="Medicines">
      <div class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.59 13.41l-8.6 8.6c-1.56 1.56-4.09 1.56-5.66 0s-1.56-4.1 0-5.66l8.6-8.6 5.66 5.66zM7.1 6.9L6 8l2.12 2.12 1.1-1.1L7.1 6.9z"/></svg></div>
      <span>Medicines</span>
    </a>
    <a href="vitals.html" id="nav-fever" class="nav-item" aria-label="Vitals">
      <div class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 14.5V7a3 3 0 0 0-6 0v7.5A4 4 0 1 0 15 14.5z"/></svg></div>
      <span>Vitals</span>
    </a>
    <a href="history.html" id="nav-history" class="nav-item" aria-label="History">
      <div class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17h3V7H3v10zm5 0h3V3H8v14zm5 0h3V11h-3v6zm5 0h3v-4h-3v4z"/></svg></div>
      <span>History</span>
    </a>
    <a href="settings.html" id="nav-settings" class="nav-item" aria-label="Settings">
      <div class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96c-.5-.4-1.05-.71-1.62-.94L14.5 2.5a.5.5 0 0 0-.5-.5h-3.99a.5.5 0 0 0-.5.5l-.38 2.1c-.57.23-1.1.54-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.9a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.6a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.4.32.62.22l2.39-.96c.5.4 1.05.71 1.62.94l.38 2.1c.05.27.28.48.55.48h3.99c.27 0 .5-.21.55-.48l.38-2.1c.57-.23 1.1-.54 1.62-.94l2.39.96c.22.09.49 0 .62-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58z"/></svg></div>
      <span>Settings</span>
    </a>
  </nav> 

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
